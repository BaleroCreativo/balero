<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proceso: leads, servicio y facturación – Balero Creativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Playfair+Display:ital,wght@1,600;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F7F5F0; --ink:#171417; --lila:#B9A2E8; --deep:#5B2A9D; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;background:var(--bg)}
  .page{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg);padding:70px 80px 0}
  .eyebrow{display:flex;align-items:center;gap:14px;font:700 18px/1 'Source Sans 3',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--deep);margin-bottom:18px}
  .eyebrow::before{content:"";width:40px;height:3px;background:var(--deep)}
  h1{color:var(--ink);white-space:nowrap}
  h1 .a{font:italic 700 60px/1.05 'Playfair Display',serif;letter-spacing:-.02em}
  h1 .b{font:900 52px/1.05 'Archivo',sans-serif;letter-spacing:-.035em}
  h1 mark{background:var(--lila);color:var(--ink);padding:0 10px 3px;margin:0 0 0 -2px;border-radius:4px}
  .flow{display:flex;align-items:center;gap:0;margin-top:52px}
  .card{flex:1;position:relative;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:22px 24px 26px;height:262px;display:flex;flex-direction:column}
  .badge{position:absolute;top:-22px;left:22px;width:50px;height:50px;border-radius:50%;background:var(--lila);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font:900 26px/1 'Archivo',sans-serif;color:var(--ink)}
  .icon{height:76px;width:auto;align-self:flex-start;margin-top:22px}
  .card p{margin-top:auto;font:900 29px/1.12 'Archivo',sans-serif;letter-spacing:-.02em;color:var(--ink)}
  .arrow{flex:none;width:68px;display:flex;justify-content:center}
  .arrow svg{width:44px;height:20px}
  .iso{position:absolute;right:80px;bottom:68px;height:42px}
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">El proceso</div>
  <h1><span class="a">Del primer mensaje</span> <span class="b">a la <mark>factura</mark></span></h1>
  <div class="flow"><div class="card"><div class="badge">1</div><svg class="icon" viewBox="0 0 120 64" fill="none" stroke="#171417" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8 H44 a6 6 0 0 1 6 6 V34 a6 6 0 0 1 -6 6 H28 L18 50 V40 H8 a6 6 0 0 1 -6 -6 V14 a6 6 0 0 1 6 -6z" transform="translate(0,2)"/><line x1="12" y1="22" x2="40" y2="22"/><line x1="12" y1="31" x2="30" y2="31"/><rect x="66" y="16" width="50" height="34" rx="6"/><path d="M68 20 L91 38 L114 20" stroke="#8B5CF6"/></svg><p>Atención de Leads en WhatsApp/Email</p></div><div class="arrow"><svg viewBox="0 0 56 24" fill="none" stroke="#171417" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 H50 M40 3 L51 12 L40 21"/></svg></div><div class="card"><div class="badge">2</div><svg class="icon" viewBox="0 0 64 64" fill="none" stroke="#171417" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="40" height="48" rx="7"/><rect x="23" y="5" width="18" height="12" rx="4" fill="#B9A2E8"/><path d="M20 30 l4 4 8 -9" stroke="#8B5CF6"/><line x1="38" y1="31" x2="45" y2="31"/><path d="M20 46 l4 4 8 -9" stroke="#8B5CF6"/><line x1="38" y1="47" x2="45" y2="47"/></svg><p>Ejecución del Servicio</p></div><div class="arrow"><svg viewBox="0 0 56 24" fill="none" stroke="#171417" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 H50 M40 3 L51 12 L40 21"/></svg></div><div class="card"><div class="badge">3</div><svg class="icon" viewBox="0 0 64 64" fill="none" stroke="#171417" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6 H50 V58 L44 53 L38 58 L32 53 L26 58 L20 53 L14 58 Z"/><line x1="22" y1="18" x2="42" y2="18"/><line x1="22" y1="28" x2="42" y2="28"/><line x1="22" y1="38" x2="32" y2="38"/><circle cx="40" cy="39" r="5" stroke="#8B5CF6"/></svg><p>Facturación y Administración</p></div></div>
  <img class="iso" src="assets/balero-isotipo-negro.png" alt="Balero Creativo">
</div>
</body>
</html>
