<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Caso real – Cliente agrícola – Balero Creativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0A0A0B; --cream:#F4EFE6; --muted:#A9A3AD; --violet:#8B5CF6; --accent:#B79CF0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg);padding:64px 88px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font:700 22px/1 'Source Sans 3',sans-serif;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-bottom:34px}
  .eyebrow::after{content:"";display:inline-block;width:56px;height:2px;background:var(--accent);vertical-align:middle;margin-left:22px}
  h1{font:italic 700 88px/1.06 'Playfair Display',serif;color:var(--cream);letter-spacing:-.015em;max-width:1000px;text-wrap:balance}
  h1 em{color:var(--accent);font-style:italic}
  .sub{margin-top:34px;max-width:820px;font:400 28px/1.4 'Source Sans 3',sans-serif;color:var(--muted)}
  .logo{position:absolute;right:72px;bottom:36px;height:76px}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Caso real — Cliente agrícola</div>
  <h1>Costo por lead reducido a <em>más de la mitad</em></h1>
  <p class="sub">En aproximadamente 10 meses de trabajo, ordenando primero el seguimiento de WhatsApp y después ajustando la pauta.</p>
  <img class="logo" src="assets/balero-isotipo-crema.png" alt="Balero Creativo">
</div>
</body>
</html>
