<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cadencia de seguimiento de leads – Balero Creativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F7F5F0; --ink:#171417; --muted:#6B6572; --lila:#B9A2E8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
  /* zona segura: 80px en todos los bordes */
  .text{position:absolute;left:80px;top:80px;width:690px;height:470px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{align-self:flex-start;font:800 18px/1 'Archivo',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);padding-bottom:10px;border-bottom:4px solid var(--lila);margin-bottom:28px}
  h1{color:var(--ink);font-weight:400}
  h1 .l1{display:block;font:italic 400 70px/1 'Instrument Serif',serif;letter-spacing:-.02em}
  h1 .l2{display:block;margin-top:8px;font:italic 400 70px/1 'Instrument Serif',serif;letter-spacing:-.02em}
  h1 .l2 b{font:900 58px/1 'Archivo',sans-serif;font-style:normal;letter-spacing:-.035em;text-transform:uppercase}
  h1 .hl{display:block;margin-top:14px}
  h1 .hl span{display:inline-block;background:var(--lila);color:var(--ink);padding:2px 14px 6px;font:italic 400 48px/1.05 'Instrument Serif',serif;letter-spacing:-.01em}
  h1 .hl span + span{margin-top:4px}
  .sub{margin-top:26px;width:560px;font:400 23px/1.38 'Source Sans 3',sans-serif;color:var(--muted)}
  #blocks{position:absolute;left:790px;top:110px;width:330px;height:370px}
  .brand{position:absolute;right:80px;bottom:80px;display:flex;align-items:center;gap:12px;font:600 19px/1 'Source Sans 3',sans-serif;color:var(--muted)}
  .brand img{height:44px}
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="eyebrow">Seguimiento de leads</div>
    <h1>
      <span class="l1">Cadencia de seguimiento</span>
      <span class="l2">de <b>Leads</b></span>
      <span class="hl"><span>cuándo insistir</span><br><span>y cuándo dejarlo ir.</span></span>
    </h1>
    <p class="sub">Un esquema simple de contactos, día por día, para pymes sin equipo de ventas.</p>
  </div>
  <svg id="blocks" viewBox="0 0 330 370" xmlns="http://www.w3.org/2000/svg">
<line x1="40" y1="34.0" x2="40" y2="330.0" stroke="#171417" stroke-width="3" stroke-linecap="round" stroke-dasharray="0"/>
<circle cx="40" cy="34.0" r="9" fill="#F7F5F0" stroke="#171417" stroke-width="3"/>
<rect x="82" y="10" width="240" height="56" rx="16" fill="#171417"/>
<rect x="78" y="6" width="240" height="56" rx="16" fill="#fff" stroke="#171417" stroke-width="3"/>
<text x="94" y="28" font-family="Archivo" font-weight="900" font-size="13" letter-spacing="2" fill="#171417">DÍA 0</text>
<rect x="94" y="38" width="170" height="7" rx="3.5" fill="#D8D2E2"/>
<rect x="94" y="49" width="102" height="7" rx="3.5" fill="#D8D2E2"/>
<circle cx="40" cy="108.0" r="9" fill="#F7F5F0" stroke="#171417" stroke-width="3"/>
<rect x="82" y="84" width="210" height="56" rx="16" fill="#171417"/>
<rect x="78" y="80" width="210" height="56" rx="16" fill="#fff" stroke="#171417" stroke-width="3"/>
<text x="94" y="102" font-family="Archivo" font-weight="900" font-size="13" letter-spacing="2" fill="#171417">DÍA 1</text>
<rect x="94" y="112" width="140" height="7" rx="3.5" fill="#D8D2E2"/>
<rect x="94" y="123" width="84" height="7" rx="3.5" fill="#D8D2E2"/>
<circle cx="40" cy="182.0" r="9" fill="#F7F5F0" stroke="#171417" stroke-width="3"/>
<rect x="82" y="158" width="240" height="56" rx="16" fill="#171417"/>
<rect x="78" y="154" width="240" height="56" rx="16" fill="#fff" stroke="#171417" stroke-width="3"/>
<text x="94" y="176" font-family="Archivo" font-weight="900" font-size="13" letter-spacing="2" fill="#171417">DÍA 3</text>
<rect x="94" y="186" width="170" height="7" rx="3.5" fill="#D8D2E2"/>
<rect x="94" y="197" width="102" height="7" rx="3.5" fill="#D8D2E2"/>
<circle cx="40" cy="256.0" r="9" fill="#B9A2E8" stroke="#171417" stroke-width="3"/>
<rect x="82" y="232" width="190" height="56" rx="16" fill="#171417"/>
<rect x="78" y="228" width="190" height="56" rx="16" fill="#B9A2E8" stroke="#171417" stroke-width="3"/>
<text x="94" y="250" font-family="Archivo" font-weight="900" font-size="13" letter-spacing="2" fill="#171417">DÍA 7</text>
<rect x="94" y="260" width="120" height="7" rx="3.5" fill="#8F77CC"/>
<rect x="94" y="271" width="72" height="7" rx="3.5" fill="#8F77CC"/>
<line x1="40" y1="282" x2="40" y2="330.0" stroke="#171417" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
<circle cx="40" cy="330.0" r="9" fill="#F7F5F0" stroke="#8C8693" stroke-width="3" stroke-dasharray="4 4"/>
<rect x="78" y="302" width="170" height="56" rx="16" fill="none" stroke="#8C8693" stroke-width="3" stroke-dasharray="7 7"/>
<text x="94" y="324" font-family="Archivo" font-weight="900" font-size="13" letter-spacing="2" fill="#8C8693">DESPUÉS</text>
<rect x="94" y="334" width="100" height="7" rx="3.5" fill="#DDD8E3"/>
<rect x="94" y="345" width="60" height="7" rx="3.5" fill="#DDD8E3"/>
<path d="M260 330.0 h26 m-8 -8 l8 8 -8 8" fill="none" stroke="#8C8693" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
  <div class="brand"><img src="assets/balero-isotipo-negro.png" alt=""><span>Balero Creativo</span></div>
</div>
</body>
</html>
