<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>7 errores al dar seguimiento a leads – Balero Creativo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#171417;--muted:#6B6572;--lila:#B9A2E8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;background:var(--bg)}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
.text{position:absolute;left:80px;top:80px;width:640px;height:470px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{align-self:flex-start;font:800 18px/1 'Archivo',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);padding-bottom:10px;border-bottom:4px solid var(--lila);margin-bottom:26px}
h1{color:var(--ink);font-weight:400}
h1 .a{display:block;font:italic 400 62px/1.05 'Instrument Serif',serif;letter-spacing:-.02em}
h1 .b{display:block;margin-top:4px;font:900 43px/1.06 'Archivo',sans-serif;letter-spacing:-.035em;text-transform:uppercase}
h1 .hl{display:block;margin-top:14px}
h1 .hl span{display:inline-block;background:var(--lila);color:var(--ink);padding:2px 14px 6px;font:italic 400 36px/1.08 'Instrument Serif',serif;letter-spacing:-.01em}
h1 .hl span+span{margin-top:4px}
.sub{margin-top:22px;width:540px;text-wrap:balance;font:400 22px/1.38 'Source Sans 3',sans-serif;color:var(--muted)}
.blocks{position:absolute;left:0;top:0;pointer-events:none}
.brand{position:absolute;right:80px;bottom:80px;display:flex;align-items:center;gap:12px;font:600 19px/1 'Source Sans 3',sans-serif;color:var(--muted)}
.brand img{height:40px}
</style></head><body>
<div class="card">
  <div class="text">
    <div class="eyebrow">Seguimiento comercial</div>
    <h1><span class="a">7 errores al dar</span><span class="b">seguimiento a leads</span><span class="hl"><span>y cómo evitarlos sin gastar</span><br><span>más en pauta.</span></span></h1>
    <p class="sub">La pauta no suele ser el problema. El dinero se escapa después, en el seguimiento.</p>
  </div>
  <svg class="blocks" viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg"><g><circle cx="950" cy="300" r="165" fill="#B9A2E8" opacity=".22"/><ellipse cx="945" cy="484" rx="88" ry="8" fill="#171417" opacity=".13"/><path d="M800 172 H1080 L1000 330 V400 H880 V330 Z" fill="#171417" transform="translate(9 9)" stroke="#171417" stroke-width="4" stroke-linejoin="round"/><path d="M800 172 H1080 L1000 330 V400 H880 V330 Z" fill="#B9A2E8" stroke="#171417" stroke-width="4" stroke-linejoin="round"/><path d="M826 224 H1054 M850 272 H1030" stroke="#171417" stroke-width="3.5" stroke-linecap="round" opacity=".35"/><ellipse cx="940" cy="172" rx="140" ry="17" fill="#171417" stroke="#171417" stroke-width="4"/><ellipse cx="940" cy="172" rx="118" ry="9" fill="#3A353D"/><circle cx="878" cy="118" r="12" fill="#171417" stroke="#171417" stroke-width="3.5"/><circle cx="918" cy="100" r="12" fill="#171417" stroke="#171417" stroke-width="3.5"/><circle cx="962" cy="122" r="12" fill="#B9A2E8" stroke="#171417" stroke-width="3.5"/><circle cx="1004" cy="104" r="12" fill="#171417" stroke="#171417" stroke-width="3.5"/><circle cx="1040" cy="130" r="12" fill="#171417" stroke="#171417" stroke-width="3.5"/><path d="M846 252 l-10 8 l8 6 l-10 9" fill="none" stroke="#171417" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="812" cy="290" r="11" fill="#fff" stroke="#171417" stroke-width="3.5"/><circle cx="796" cy="338" r="11" fill="#fff" stroke="#171417" stroke-width="3.5"/><circle cx="820" cy="386" r="11" fill="#fff" stroke="#171417" stroke-width="3.5"/><path d="M812 306 v10 M796 354 v10 M820 402 v8" stroke="#6B6572" stroke-width="3.5" stroke-linecap="round"/><circle cx="940" cy="446" r="28" fill="#B9A2E8" stroke="#171417" stroke-width="4"/><path d="M927 446 l9 9 l17 -19" fill="none" stroke="#171417" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
  <div class="brand"><img src="assets/balero-isotipo-negro.png" alt=""><span>Balero Creativo</span></div>
</div>
</body></html>
