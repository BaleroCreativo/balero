<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>3-5 intentos antes de pausar el seguimiento – Balero Creativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Playfair+Display:ital,wght@1,600;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F7F5F0; --ink:#171417; --muted:#6B6572; --lila:#B9A2E8; --deep:#5B2A9D; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;background:var(--bg)}
  .page{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);padding:84px 80px 80px;display:flex;flex-direction:column}
  .eyebrow{display:flex;align-items:center;gap:16px;font:700 22px/1 'Source Sans 3',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--deep)}
  .eyebrow::before{content:"";width:48px;height:3px;background:var(--deep)}
  .main{flex:1;display:flex;flex-direction:column;justify-content:center}
  .big{align-self:flex-start;font:900 470px/.86 'Archivo',sans-serif;letter-spacing:-.06em;color:var(--ink);margin-left:-14px;padding:0 6px;background:linear-gradient(transparent 66%, var(--lila) 66%, var(--lila) 94%, transparent 94%)}
  .dots{display:flex;gap:20px;margin:46px 0 40px}
  .dots i{width:64px;height:64px;border-radius:50%;border:5px solid var(--ink);background:#fff}
  .dots i.on{background:var(--lila)}
  .claim{font:italic 600 54px/1.18 'Playfair Display',serif;letter-spacing:-.015em;color:var(--ink);max-width:900px}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;border-top:3px solid var(--ink);padding-top:30px}
  .ctx{max-width:700px;font:400 28px/1.4 'Source Sans 3',sans-serif;color:var(--muted)}
  .bottom img{flex:none;height:62px}
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">Referencia del sector</div>
  <div class="main">
    <div class="big">3-5</div>
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
    <p class="claim">intentos antes de pausar el seguimiento activo, según encuestas de ventas del sector</p>
  </div>
  <div class="bottom">
    <p class="ctx">No es una regla exacta. Lo que importa es que exista un número y que todo el equipo lo use igual.</p>
    <img src="assets/balero-isotipo-negro.png" alt="Balero Creativo">
  </div>
</div>
</body>
</html>
