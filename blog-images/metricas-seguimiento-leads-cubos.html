<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Métricas de seguimiento de leads – Balero Creativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F7F5F0; --ink:#171417; --muted:#6B6572; --lila:#B9A2E8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
  /* zona segura: 80px en todos los bordes */
  .text{position:absolute;left:80px;top:80px;width:690px;height:470px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{align-self:flex-start;font:800 18px/1 'Archivo',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);padding-bottom:10px;border-bottom:4px solid var(--lila);margin-bottom:28px}
  h1{color:var(--ink);font-weight:400}
  h1 .l1{display:block;font:italic 400 66px/1 'Instrument Serif',serif;letter-spacing:-.02em}
  h1 .l2{display:block;margin-top:6px;font:italic 400 66px/1 'Instrument Serif',serif;letter-spacing:-.02em}
  h1 .l2 b{font:900 56px/1 'Archivo',sans-serif;font-style:normal;letter-spacing:-.035em;text-transform:uppercase}
  h1 .hl{display:block;margin-top:12px}
  h1 .hl span{display:inline-block;background:var(--lila);color:var(--ink);padding:2px 14px 6px;font:italic 400 44px/1.05 'Instrument Serif',serif;letter-spacing:-.01em}
  h1 .hl span + span{margin-top:4px}
  .sub{margin-top:24px;width:540px;text-wrap:balance;font:400 23px/1.38 'Source Sans 3',sans-serif;color:var(--muted)}
  #blocks{position:absolute;left:0;top:0;pointer-events:none}
  .brand{position:absolute;right:80px;bottom:80px;display:flex;align-items:center;gap:12px;font:600 19px/1 'Source Sans 3',sans-serif;color:var(--muted)}
  .brand img{height:44px}
</style>
</head>

    <h1>

      <span class="hl"><span>las 5 que vale la pena</span><br><span>revisar cada semana.</span></span>
