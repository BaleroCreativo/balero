<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imagen destacada – Seguimiento de leads de WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,800;0,900;1,700&family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8; --ink:#0F0D12; --muted:#58525E; --soft:#A7A2AC;
    --accent:#B79CF0; --violet:#8B5CF6; --deep:#5B2A9D; --lila:#B9A2E8; --yellow:#F7C93E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg);padding:58px 84px}
  .eyebrow{
    display:inline-block;font:800 19px/1 'Archivo',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);
    padding-bottom:9px;border-bottom:4px solid var(--accent);margin-bottom:30px;
  }
  h1{font:400 92px/.98 'Instrument Serif',serif;color:var(--ink);letter-spacing:-.02em;width:760px}
  h1 i{font-style:italic}
  h1 b{font:900 76px/1 'Archivo',sans-serif;letter-spacing:-.035em;text-transform:uppercase}
  h1 mark{display:inline-block;line-height:.92;background:var(--accent);color:var(--ink);padding:.02em .14em .06em;margin:.08em 0 0 -.02em}
  .sub{margin-top:28px;width:610px;font:400 25px/1.38 'Source Sans 3',sans-serif;color:var(--muted)}
  .sub strong{color:var(--ink);font-weight:700}
  #blocks{position:absolute;right:40px;top:130px;width:380px;height:400px}
  .sig{position:absolute;right:70px;bottom:36px;height:80px}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Seguimiento de leads</div>
  <h1>Cómo dar <i>seguimiento</i><br>a leads de <b>WhatsApp</b><br><mark>sin perderlos.</mark></h1>
  <p class="sub">5 pasos concretos para que ningún lead se quede esperando una respuesta que nunca llega.</p>
  <svg id="blocks" viewBox="-190 -230 380 400"></svg>
  <img class="sig" src="assets/balero-isotipo-negro.png" alt="Balero Creativo">
</div>
<script>
// Pirámide de cubos isométricos (los oscuros = leads en el chat; el morado = el lead que sí das seguimiento)
(function(){
  const S=64, svg=document.getElementById('blocks'), NS='http://www.w3.org/2000/svg';
  const pal={
    dark:{t:'#2B282F',l:'#0E0D10',r:'#19171B'},
    gray:{t:'#8A8690',l:'#4E4B54',r:'#67636C'},
    acc :{t:'#B79CF0',l:'#7A47D8',r:'#5B2A9D'}
  };
  const cubes=[ // i,j,k,tipo
    [0,0,0,'gray'],[1,0,0,'dark'],[2,0,0,'dark'],[0,1,0,'dark'],[1,1,0,'gray'],[2,1,0,'dark'],
    [0,0,1,'dark'],[1,0,1,'dark'],[0,1,1,'gray'],
    [0,0,2,'acc']
  ];
  const P=(i,j,k)=>[(i-j)*S*.866, (i+j)*S*.5 - k*S];
  const poly=(pts,fill)=>{const p=document.createElementNS(NS,'polygon');p.setAttribute('points',pts.map(a=>a.join(',')).join(' '));p.setAttribute('fill',fill);p.setAttribute('stroke','rgba(0,0,0,.25)');p.setAttribute('stroke-width','1');svg.appendChild(p)};
  // sombra
  const sh=document.createElementNS(NS,'ellipse');sh.setAttribute('cx',0);sh.setAttribute('cy',118);sh.setAttribute('rx',165);sh.setAttribute('ry',40);sh.setAttribute('fill','rgba(15,13,18,.10)');svg.appendChild(sh);
  // glow del cubo morado
  const defs=document.createElementNS(NS,'defs');defs.innerHTML='<radialGradient id="g"><stop offset="0" stop-color="#B79CF0" stop-opacity=".55"/><stop offset="1" stop-color="#B79CF0" stop-opacity="0"/></radialGradient>';svg.appendChild(defs);
  const gp=P(0,0,2.5);const gl=document.createElementNS(NS,'circle');gl.setAttribute('cx',gp[0]);gl.setAttribute('cy',gp[1]);gl.setAttribute('r',130);gl.setAttribute('fill','url(#g)');svg.appendChild(gl);
  cubes.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
  cubes.forEach(([i,j,k,t])=>{
    const c=pal[t], T=P(i,j,k+1), a=[T[0],T[1]-S*.5], b=[T[0]+S*.866,T[1]], d=[T[0],T[1]+S*.5], e=[T[0]-S*.866,T[1]];
    poly([a,b,d,e],c.t);
    poly([e,d,[d[0],d[1]+S],[e[0],e[1]+S]],c.l);
    poly([d,b,[b[0],b[1]+S],[d[0],d[1]+S]],c.r);
  });
})();
</script>
</body>
</html>
