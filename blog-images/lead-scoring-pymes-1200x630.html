<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Lead scoring para pymes – Balero Creativo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--ink:#171417;--muted:#6B6572;--lila:#B9A2E8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;background:var(--bg)}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
.text{position:absolute;left:80px;top:80px;width:620px;height:470px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{align-self:flex-start;font:800 18px/1 'Archivo',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);padding-bottom:10px;border-bottom:4px solid var(--lila);margin-bottom:26px}
h1{color:var(--ink);font-weight:400}
h1 .a{display:block;font:italic 400 76px/1 'Instrument Serif',serif;letter-spacing:-.02em}
h1 .b{display:block;margin-top:4px;font:900 58px/1.04 'Archivo',sans-serif;letter-spacing:-.035em;text-transform:uppercase}
h1 .hl{display:block;margin-top:14px}
h1 .hl span{display:inline-block;background:var(--lila);color:var(--ink);padding:2px 14px 6px;font:italic 400 42px/1.05 'Instrument Serif',serif;letter-spacing:-.01em}
h1 .hl span+span{margin-top:4px}
.sub{margin-top:22px;width:540px;text-wrap:balance;font:400 22px/1.38 'Source Sans 3',sans-serif;color:var(--muted)}
.blocks{position:absolute;left:0;top:0;pointer-events:none}
.brand{position:absolute;right:80px;bottom:80px;display:flex;align-items:center;gap:12px;font:600 19px/1 'Source Sans 3',sans-serif;color:var(--muted)}
.brand img{height:40px}
</style></head><body>
<div class="card">
  <div class="text">
    <div class="eyebrow">Seguimiento de leads</div>
    <h1><span class="a">Lead scoring</span><span class="b">para pymes</span><span class="hl"><span>cómo priorizar a quién</span><br><span>le contestas primero.</span></span></h1>
    <p class="sub">Una tabla de 5 preguntas para decidir, sin CRM, a quién escribirle primero.</p>
  </div>
  <svg class="blocks" viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg"><ellipse cx="930" cy="422" rx="175" ry="60" fill="#171417" opacity=".13"/><g transform="translate(930.0 340.0)"><polygon points="-83.1,-96.0 0.0,-48.0 0.0,48.0 -83.1,0.0" fill="#171417" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="83.1,-96.0 0.0,-48.0 0.0,48.0 83.1,0.0" fill="#2D292F" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="0.0,-144.0 83.1,-96.0 0.0,-48.0 -83.1,-96.0" fill="#4B464E" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="0.0,-48.0 83.1,0.0 83.1,96.0 0.0,48.0" fill="#171417" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="166.3,-48.0 83.1,0.0 83.1,96.0 166.3,48.0" fill="#2D292F" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="83.1,-96.0 166.3,-48.0 83.1,0.0 0.0,-48.0" fill="#4B464E" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="-166.3,-48.0 -83.1,0.0 -83.1,96.0 -166.3,48.0" fill="#171417" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="0.0,-48.0 -83.1,0.0 -83.1,96.0 0.0,48.0" fill="#2D292F" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="-83.1,-96.0 0.0,-48.0 -83.1,0.0 -166.3,-48.0" fill="#4B464E" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="-83.1,-192.0 0.0,-144.0 0.0,-48.0 -83.1,-96.0" fill="#B9A2E8" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="83.1,-192.0 0.0,-144.0 0.0,-48.0 83.1,-96.0" fill="#9A82D8" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="0.0,-240.0 83.1,-192.0 0.0,-144.0 -83.1,-192.0" fill="#D5C8F3" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/></g></svg>
  <div class="brand"><img src="assets/balero-isotipo-negro.png" alt=""><span>Balero Creativo</span></div>
</div>
</body></html>
