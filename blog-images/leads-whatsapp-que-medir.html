<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Qué vale la pena medir – Balero Creativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Caveat:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0A0A0B; --cream:#F4EFE6; --muted:#A9A3AD; --violet:#8B5CF6; --accent:#B79CF0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg);padding:60px 72px 0}
  .eyebrow{font:700 22px/1 'Source Sans 3',sans-serif;letter-spacing:.42em;text-transform:uppercase;color:var(--cream)}
  .eyebrow::after{content:"";display:block;width:64px;height:4px;background:var(--accent);margin-top:16px}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
  .col{height:350px;border:2px solid rgba(244,239,230,.16);border-radius:18px;padding:26px 28px 28px;display:flex;flex-direction:column}
  .tag{font:700 17px/1 'Source Sans 3',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .hero{flex:1;display:flex;align-items:center;font:900 52px/.98 'Archivo',sans-serif;text-transform:uppercase;letter-spacing:-.03em;color:var(--accent)}
  .hero.big{font-size:168px;line-height:1;letter-spacing:-.05em;color:var(--violet)}
  .hero.big small{font-size:.38em;letter-spacing:0;margin-left:.1em;align-self:flex-end;margin-bottom:.12em;color:var(--accent)}
  .txt{font:400 25px/1.3 'Source Sans 3',sans-serif;color:var(--cream)}
  .sig{position:absolute;right:72px;bottom:28px;font:600 56px/1 'Caveat',cursive;color:var(--cream);transform:rotate(-5deg)}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Qué vale la pena medir</div>
  <div class="cols">
    <div class="col">
      <div class="tag">Leads / semana</div>
      <div class="hero big">N°</div>
      <div class="txt">Leads de WhatsApp que llegaron</div>
    </div>
    <div class="col">
      <div class="tag">Paso 2</div>
      <div class="hero">Sin<br>etapa</div>
      <div class="txt">Cuántos siguen sin asignar</div>
    </div>
    <div class="col">
      <div class="tag">Paso 3</div>
      <div class="hero">Cerrados<br>/ perdidos</div>
      <div class="txt">En cuáles terminó cada lead</div>
    </div>
  </div>
  <div class="sig">Balero</div>
</div>
</body>
</html>
