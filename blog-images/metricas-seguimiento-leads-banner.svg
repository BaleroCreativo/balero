<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9F5"/><stop offset="1" stop-color="#F2EEF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- formas de fondo suaves -->
  <circle cx="700" cy="340" r="250" fill="#B9A2E8" opacity=".16"/>
  <circle cx="700" cy="340" r="175" fill="#B9A2E8" opacity=".14"/>

  <!-- chips / pastillas (puntos de datos) -->
  <g>
    <rect x="960" y="92"  width="76" height="26" rx="13" fill="#B9A2E8"/>
    <rect x="1070" y="170" width="46" height="20" rx="10" fill="#F7C93E"/>
    <rect x="1000" y="238" width="58" height="22" rx="11" fill="#B9A2E8" opacity=".75"/>
    <circle cx="920" cy="190" r="9" fill="#F7C93E"/>
    <rect x="1040" y="468" width="84" height="26" rx="13" fill="#B9A2E8"/>
    <rect x="960" y="540" width="48" height="20" rx="10" fill="#F7C93E"/>
    <circle cx="1100" cy="548" r="8" fill="#5B2A9D" opacity=".7"/>
    <rect x="110" y="478" width="86" height="26" rx="13" fill="#B9A2E8"/>
    <rect x="236" y="548" width="52" height="20" rx="10" fill="#F7C93E"/>
    <circle cx="86" cy="392" r="9" fill="#F7C93E"/>
    <rect x="170" y="400" width="52" height="20" rx="10" fill="#B9A2E8" opacity=".7"/>
    <circle cx="330" cy="500" r="7" fill="#5B2A9D" opacity=".6"/>
    <rect x="1112" y="320" width="40" height="18" rx="9" fill="#B9A2E8" opacity=".8"/>
  </g>

  <!-- sombra plana -->
  <ellipse cx="640" cy="566" rx="190" ry="18" fill="#5B2A9D" opacity=".14"/>

  <!-- calendario / checklist semanal -->
  <g stroke="#171417" stroke-linejoin="round" stroke-linecap="round">
    <rect x="470" y="160" width="340" height="380" rx="26" fill="#FFFFFF" stroke-width="7"/>
    <!-- cabecera -->
    <path d="M473.5 232 V186 a22 22 0 0 1 22 -22 H784.5 a22 22 0 0 1 22 22 V232 Z" fill="#5B2A9D" stroke="none"/>
    <path d="M470 232 H810" stroke-width="7"/>
    <!-- anillas -->
    <rect x="540" y="136" width="20" height="46" rx="10" fill="#F7C93E" stroke-width="6"/>
    <rect x="720" y="136" width="20" height="46" rx="10" fill="#F7C93E" stroke-width="6"/>
    <!-- días de la semana (7 puntos) -->
    <g stroke="none">
      <circle cx="510" cy="200" r="9" fill="#B9A2E8"/><circle cx="545" cy="200" r="9" fill="#B9A2E8"/>
      <circle cx="580" cy="200" r="9" fill="#B9A2E8"/><circle cx="615" cy="200" r="9" fill="#B9A2E8"/>
      <circle cx="650" cy="200" r="9" fill="#B9A2E8"/><circle cx="685" cy="200" r="9" fill="#B9A2E8"/>
      <circle cx="720" cy="200" r="9" fill="#F7C93E"/>
    </g>

    <!-- 5 filas de checklist -->
    <g stroke-width="5.5">
      <!-- fila 1 -->
      <rect x="505" y="258" width="34" height="34" rx="9" fill="#5B2A9D"/>
      <path d="M512 275 l8 8 l12 -14" fill="none" stroke="#fff" stroke-width="5.5"/>
      <rect x="560" y="268" width="190" height="14" rx="7" fill="#B9A2E8" stroke="none"/>
      <!-- fila 2 -->
      <rect x="505" y="312" width="34" height="34" rx="9" fill="#5B2A9D"/>
      <path d="M512 329 l8 8 l12 -14" fill="none" stroke="#fff" stroke-width="5.5"/>
      <rect x="560" y="322" width="150" height="14" rx="7" fill="#B9A2E8" stroke="none"/>
      <!-- fila 3 -->
      <rect x="505" y="366" width="34" height="34" rx="9" fill="#5B2A9D"/>
      <path d="M512 383 l8 8 l12 -14" fill="none" stroke="#fff" stroke-width="5.5"/>
      <rect x="560" y="376" width="205" height="14" rx="7" fill="#B9A2E8" stroke="none"/>
      <!-- fila 4 -->
      <rect x="505" y="420" width="34" height="34" rx="9" fill="#FFFFFF"/>
      <rect x="560" y="430" width="125" height="14" rx="7" fill="#B9A2E8" stroke="none"/>
      <!-- fila 5 -->
      <rect x="505" y="474" width="34" height="34" rx="9" fill="#FFFFFF"/>
      <rect x="560" y="484" width="170" height="14" rx="7" fill="#B9A2E8" stroke="none"/>
    </g>

    <!-- insignia amarilla con check (resaltado) -->
    <circle cx="806" cy="168" r="38" fill="#F7C93E" stroke-width="7"/>
    <path d="M788 168 l13 13 l22 -26" fill="none" stroke-width="8"/>

    <!-- lupa -->
    <line x1="742" y1="478" x2="830" y2="566" stroke-width="34"/>
    <line x1="742" y1="478" x2="830" y2="566" stroke="#5B2A9D" stroke-width="18"/>
    <circle cx="690" cy="426" r="84" fill="#B9A2E8" fill-opacity=".38" stroke-width="12"/>
    <path d="M642 400 a56 56 0 0 1 36 -34" fill="none" stroke="#FFFFFF" stroke-width="9" opacity=".9"/>
  </g>
</svg>
